server:
  port: ${SERVER_PORT:8182}

spring:
  application:
    name: occupify-core
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  config:
    import: optional:file:core.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5531/occupify_core}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    connect-retries: 30
    connect-retries-interval: 5
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  rabbitmq:
    exchange: ${RABBITMQ_NOTIFICATION_EXCHANGE:occupify.notification.exchange}
    project-created-routing-key: ${RABBITMQ_PROJECT_CREATED_ROUTING_KEY:project.created}
    project-closed-routing-key: ${RABBITMQ_PROJECT_CLOSED_ROUTING_KEY:project.closed}
    bid-created-routing-key: ${RABBITMQ_BID_CREATED_ROUTING_KEY:bid.created}
    bid-cancelled-routing-key: ${RABBITMQ_BID_CANCELLED_ROUTING_KEY:bid.cancelled}
    user-queue: ${RABBITMQ_USER_QUEUE:occupify.core.user.queue}
    user-registered-routing-key: ${RABBITMQ_USER_REGISTERED_ROUTING_KEY:user.registered}
    dlx-exchange: ${RABBITMQ_DLX_EXCHANGE:occupify.core.dlx}
    dlq-queue: ${RABBITMQ_USER_DLQ:occupify.core.user.dlq}
    dlq-routing-key: ${RABBITMQ_USER_DLQ_ROUTING_KEY:user.dlq}
  auth:
    dev-mock:
      enabled: ${DEV_MOCK_AUTH_ENABLED:false}
      user-id: 00000000-0000-0000-0000-000000000001
      user-role: USER
      user-email: dev-employer@occupify.local
  storage:
    s3:
      bucket-namespace: ${S3_BUCKET_NAMESPACE:}
      region: ${S3_REGION:ap-singapore-1}
      endpoint: ${S3_ENDPOINT:}
      bucket-name: ${S3_BUCKET_NAME:occupify-storage}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      public-url-prefix: ${S3_PUBLIC_URL_PREFIX:}
      path-style-access-enabled: ${S3_PATH_STYLE_ACCESS_ENABLED:true}
      presigned-duration-minutes: ${S3_PRESIGNED_DURATION_MINUTES:15}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
