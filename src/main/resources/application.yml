server:
  port: ${SERVER_PORT:8182}

spring:
  application:
    name: occupify-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5531/occupify_core}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-seed
    baseline-on-migrate: true
    out-of-order: true
    connect-retries: 30
    connect-retries-interval: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
