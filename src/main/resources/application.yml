server:
  port: ${SERVER_PORT:8182}

spring:
  application:
    name: occupify-core
  config:
    import: optional:file:core.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5531/occupify_core}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-seed
    baseline-on-migrate: true
    out-of-order: true
    connect-retries: 30
    connect-retries-interval: 5
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  rabbitmq:
    exchange: ${RABBITMQ_NOTIFICATION_EXCHANGE:occupify.notification.exchange}
    project-created-routing-key: ${RABBITMQ_PROJECT_CREATED_ROUTING_KEY:project.created}
    project-closed-routing-key: ${RABBITMQ_PROJECT_CLOSED_ROUTING_KEY:project.closed}
  auth:
    dev-mock:
      enabled: ${DEV_MOCK_AUTH_ENABLED:false}
      user-id: 00000000-0000-0000-0000-000000000001
      user-role: CLIENT
      user-email: dev-employer@occupify.local

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
