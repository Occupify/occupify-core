spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  rabbitmq:
    exchange: occupify.notification.exchange
    project-created-routing-key: project.created
    project-closed-routing-key: project.closed
  auth:
    dev-mock:
      enabled: false
