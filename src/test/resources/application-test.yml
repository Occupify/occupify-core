spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=RUNSCRIPT FROM 'classpath:init-h2.sql'
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  rabbitmq:
    exchange: occupify.notification.exchange
    user-exchange: occupify.user.exchange
    user-queue: occupify.core.user.queue
    user-activated-routing-key: user.activated
    project-created-routing-key: project.created
    project-closed-routing-key: project.closed
    contract-exchange: occupify.contract.exchange
    contract-accepted-routing-key: contract.accepted
    contract-rejected-routing-key: contract.rejected
    contract-core-queue: occupify.core.contract.queue
    contract-compensation-routing-key: contract.compensation.*
  auth:
    dev-mock:
      enabled: false
  storage:
    s3:
      region: ap-singapore-1
      bucket-name: test-bucket
      path-style-access-enabled: true
      presigned-duration-minutes: 15
